<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Night Flight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="view"></canvas>
  <div id="scanlines"></div>

  <aside id="panel" class="hud">
    <header>
      <div class="brand">NIGHT FLIGHT</div>
      <div id="title">–</div>
      <div id="place" class="dim"></div>
    </header>
    <h2>Colour</h2>
    <div id="modes" class="seg"></div>
    <div id="legend" hidden></div>
    <h2>Tools</h2>
    <div class="seg">
      <button id="measureBtn">Measure</button>
      <button id="sweepBtn" class="on">Radar sweep</button>
      <button id="home">Reset view</button>
    </div>
    <div id="measureOut" hidden></div>
    <h2>Display</h2>
    <label class="row"><input type="checkbox" id="edl" checked> Depth shading</label>
    <label class="row">Detail <input type="range" id="budget" min="1" max="12" step="1" value="4"> <span id="budgetOut">4M</span></label>
    <label class="row">Point size <input type="range" id="size" min="0.4" max="2.5" step="0.1" value="1"></label>
    <p class="hint">Drag to orbit · right-drag to pan · scroll to zoom · double-click to fly to a spot</p>
  </aside>

  <div id="compass" class="hud">
    <svg viewBox="-60 -60 120 120" aria-hidden="true">
      <circle r="52" class="ring" />
      <g id="dial">
        <g class="ticks"></g>
        <text y="-38" class="n">N</text><text x="40" y="4" class="c">E</text><text y="45" class="c">S</text><text x="-40" y="4" class="c">W</text>
      </g>
      <path d="M0 -26 L6 -14 L-6 -14 Z" class="needle" />
    </svg>
    <dl>
      <dt>HDG</dt><dd id="hdg">000°</dd>
      <dt>ALT</dt><dd id="alt">–</dd>
      <dt>PTS</dt><dd id="pts">–</dd>
    </dl>
  </div>

  <div id="measureLabel" hidden></div>
  <footer>
    <span id="credit"></span>
    <span id="stats">loading…</span>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
